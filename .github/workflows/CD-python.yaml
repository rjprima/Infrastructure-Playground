name: build/deploy python resources

on: 
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Worker
      id: meta-worker
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/worker
        tags: |
          type=raw,value=latest

    - name: Extract metadata for CLI
      id: meta-cli
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/cli
        tags: |
          type=raw,value=latest

    - name: Build Worker
      uses: docker/build-push-action@v5
      with:
        context: ./Core/backend
        push: true
        tags: ${{ steps.meta-worker.outputs.tags }}

    - name: Build CLI
      uses: docker/build-push-action@v5
      with:
        context: ./Core/frontend
        push: true
        tags: ${{ steps.meta-cli.outputs.tags }}