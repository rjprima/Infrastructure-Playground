name: build/deploy backup-scheduler resources

on: 
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Backup-scheduler
      uses: docker/build-push-action@v5
      with:
        context: ./Core/backup-scheduler
        push: true
        tags: ghcr.io/rprima/infrastructure-playground/backup-scheduler:latest